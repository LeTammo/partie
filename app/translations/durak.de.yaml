# --- Spielanleitung ---
rules: |-
    Dieses Durak ist eine freie Simulation: Die App merkt sich nur, wo welche Karte liegt – sie prüft keine Regeln. Alles Weitere (auch Schummeln und Auffliegenlassen) regelt ihr untereinander, wie am echten Tisch.
    Zieht euch zu Beginn selbst je 6 Karten. Die unterste Karte des Nachziehstapels zeigt den Trumpf.
    Karten bewegt ihr frei per Ziehen oder Anklicken: vom Stapel ziehen (oder zurücklegen), in die Mitte spielen, aus der Mitte aufnehmen, auf den Ablagestapel legen oder von dort nehmen. Jede Bewegung ist für alle sichtbar animiert.
    Lege eine Handkarte direkt auf eine Karte in der Mitte, um sie damit zu verteidigen – beide Karten bleiben als Paar zusammen liegen, bis jemand sie abräumt. Das geht auch mit Karten, die schon in der Mitte liegen, und lässt sich wieder rückgängig machen, indem man die oberste Karte eines Stapels einfach wieder frei ablegt.
    Karten in der Mitte dreht ihr mit Mittelklick, Doppelklick oder „F“ beim Draufzeigen um.
    Ziehe eine Handkarte auf einen Mitspieler, um sie ihm heimlich unterzuschieben – nimmt er an, wandert sie ohne auffällige Animation in seine Hand.
    Klassisch gilt: Der Angreifer legt Karten in die Mitte, der Verteidiger schlägt sie mit einer höheren Karte gleicher Farbe oder einem Trumpf. Wer am Ende als Letzter Karten hält, ist der Durak.
