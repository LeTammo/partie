# --- How to play ---
rules: |-
    This Durak is a free simulation: the app only tracks where every card lies – it enforces no rules. Everything else (including cheating and calling it out) is settled among yourselves, just like at a real table.
    Start by drawing 6 cards each. The bottom card of the draw pile shows the trump suit.
    Move cards freely by dragging or clicking: draw from the pile (or put cards back), play into the middle, pick up from the middle, discard or take from the discard pile. Every move is animated for everyone to see.
    Drop a hand card directly onto a card in the middle to defend it - the two stay paired until someone clears them away. Works with cards already in the middle too, and can be undone by dropping a pile's top card back down to lie on its own again.
    Flip cards in the middle with middle-click, double-click or “F” while pointing at them.
    Drag a hand card onto another player to slip it to them quietly – if they accept, it moves into their hand without a conspicuous animation.
    Classic rules: the attacker plays cards into the middle, the defender beats them with a higher card of the same suit or a trump. Whoever is left holding cards at the end is the durak.
